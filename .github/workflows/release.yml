name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package plugin
        run: zip -r murdoku.koplugin.zip murdoku.koplugin
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: murdoku.koplugin.zip
          generate_release_notes: true
